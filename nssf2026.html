 "武汉体育学院", "cross": true, "match": "单位含体育"}];
const CATS = ["重点项目","一般项目","青年项目","西部项目"];
let state = {dset:"all", cat:"", q:"", sort:"no", dir:1};

function renderCards(){
  const main = DATA.filter(r=>!r.cross);
  const cc = DATA.filter(r=>r.cross);
  let h = "";
  CATS.forEach(c=>{
    const n = main.filter(r=>r.cat===c).length;
    h += `<div class="card"><div class="n">${n}</div><div class="l">${c}</div></div>`;
  });
  h += `<div class="card cross"><div class="n">${cc.length}</div><div class="l">其他口子交叉</div></div>`;
  h += `<div class="card"><div class="n">${DATA.length}</div><div class="l">合计</div></div>`;
  document.getElementById("cards").innerHTML = h;
}

function init(){
  const sel = document.getElementById("cat");
  CATS.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o); });
  renderCards();
  document.querySelectorAll("#dset button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#dset button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); state.dset=b.dataset.v; draw();
  });
  sel.onchange=()=>{state.cat=sel.value;draw();};
  document.getElementById("q").oninput=e=>{state.q=e.target.value.trim();draw();};
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(state.sort===k)state.dir*=-1; else{state.sort=k;state.dir=1;} draw();
  });
  document.getElementById("exp").onclick=exportCSV;
  draw();
}

function filt(){
  let a = DATA.filter(r=>{
    if(state.dset==="main" && r.cross) return false;
    if(state.dset==="cross" && !r.cross) return false;
    if(state.cat && r.cat!==state.cat) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      const hay=(r.title+r.who+r.org+r.disc).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const k=state.sort, d=state.dir;
  a.sort((x,y)=>{
    let xv=x[k], yv=y[k];
    if(k==="no"){xv=+xv;yv=+yv;}
    if(typeof xv==="number") return (xv-yv)*d;
    return String(xv).localeCompare(String(yv),"zh")*d;
  });
  return a;
}

function draw(){
  const a=filt();
  const tb=document.getElementById("body");
  document.getElementById("cnt").textContent = `共 ${a.length} 条`;
  document.getElementById("empty").style.display = a.length? "none":"block";
  tb.innerHTML = a.map(r=>{
    const tag = r.cross ? `<span class="tag cross">其他口子</span><span class="badge">${r.match}</span>` : `<span class="tag">${r.disc}</span>`;
    return `<tr>
      <td class="no">${r.no}</td>
      <td>${r.cat}</td>
      <td>${tag}</td>
      <td class="title">${r.title}</td>
      <td>${r.who}</td>
      <td>${r.org}</td>
    </tr>`;
  }).join("");
}

function exportCSV(){
  const a=filt();
  const head=["序号","项目类别","涉及学科","课题名称","申请人","责任单位"];
  const rows=a.map(r=>[r.no,r.cat,r.disc,r.title,r.who,r.org]);
  const esc=v=>/[,\"\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v;
  let csv="﻿"+head.join(",")+"\n"+rows.map(r=>r.map(esc).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(blob);
  const a2=document.createElement("a"); a2.href=u; a2.download="nssf2026_体育学与健康管理.csv"; a2.click();
  URL.revokeObjectURL(u);
}
init();
</script>
