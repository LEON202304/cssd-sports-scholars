name: Portal PR visual and interaction smoke
on:
  pull_request:
    paths:
      - "index.html"
      - "portal.*.css"
      - "portal.*.js"
      - "tests/verify_portal_20261012_V1.py"
      - ".github/workflows/verify-portal-20261012-v1.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "tinycss2==1.4.0"
          python -m playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cssd-server.log 2>&1 &
          sleep 3
          python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8765/').status == 200"
      - name: Run browser smoke tests
        run: python tests/verify_portal_20261012_V1.py
      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cssd-pr25-browser-smoke
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
